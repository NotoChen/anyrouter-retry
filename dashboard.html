/* The CPAMP theme bridge supplies the host palette; no second theme controller. */
:root {
  color-scheme: light;

  --selection-border: var(--accent);
  --green: #eaf3ee; --green-text: #38734f;
  --red: #f9ecee; --red-text: #a44852;

}
:root[data-theme="dark"] {

  --red: #3c272e; --red-text: #e8a3ad;

}

.request.selected {background: var(--selected); box-shadow: inset 2px 0 0 var(--selection-border), inset 0 0 0 1px var(--line)}

<dialog id="login"><h2>连接 CPA</h2><p class="muted">请从 CPA Manager Plus 的“AnyRouter 会话请求”菜单进入，自动复用已有登录。独立访问可输入 CPA 管理密钥。</p><input id="key" type="password" autocomplete="off" aria-label="CPA 管理密钥" placeholder="CPA 管理密钥"><p class="muted">管理密钥仅在当前页面内存中使用。</p><div id="loginError" class="error"></div><div class="dialog-actions"><button id="cancelLogin">取消</button><button id="loginButton" class="primary">连接</button></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={accepted:'已接收',waiting_upstream:'等待上游',retrying:'正在重试',streaming:'正在输出',completed:'已完成',failed:'失败',interrupted:'输出后中断',cancelled:'已取消',permanent_error:'永久错误',credential_rejected:'凭据已排除',retry:'失败后重试',unknown_after_restart:'重启后结果未知'};

const clock=n=>n?new Date(n).toLocaleTimeString('zh-CN',{hour12:false}):'—';
const date=n=>n?new Date(n).toLocaleString('zh-CN',{hour12:false}):'—';
const duration=ms=>ms<1000?`${Math.max(0,ms)} ms`:ms<60000?`${(ms/1000).toFixed(1)} 秒`:`${Math.floor(ms/60000)} 分 ${Math.floor(ms/1000)%60} 秒`;
const openSessions=new Set(),expandedGroups=new Set();
try{const saved=JSON.parse(localStorage.getItem('anyrouter-retry-open-sessions')||'[]');if(Array.isArray(saved))for(const id of saved.slice(0,1000))if(typeof id==='string')openSessions.add(id)}catch{}
function saveOpenSessions(){try{localStorage.setItem('anyrouter-retry-open-sessions',JSON.stringify([...openSessions].slice(-1000)))}catch{}}
const active=r=>!r.ended_at&&r.phase!=='unknown_after_restart';
const short=v=>v?String(v).slice(-8):'未知';
const provider=r=>r.last_attempt?.credential_name||'尚未选择凭据';
const agent=r=>r.agent_name&&r.agent_name!=='/root'?r.agent_name.replace(/^\/root\/?/,''):'';
const heading=r=>r.session_title||r.project||('会话 · '+short(r.session_id));
const icon=(kind)=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${({chevron:'<path d="m9 5 7 7-7 7"/>',check:'<path d="m5 12 4 4L19 6"/>',error:'<path d="m7 7 10 10M17 7 7 17"/>',wait:'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',stream:'<path d="M4 12h3l3-6 4 12 3-6h3"/>',empty:'<rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 9h8M8 13h5"/>'})[kind]||''}</svg>`;
const emptyState=(title,description)=>`<div class="empty">${icon('empty')}<strong>${esc(title)}</strong><p>${esc(description)}</p></div>`;
const skeleton=()=>'<div class="skeleton" aria-label="正在加载" role="status">'+Array.from({length:6},()=>'<div class="skeleton-line"></div>').join('')+'</div>';
function rememberFocus(container){const el=document.activeElement;if(!el||!container.contains(el))return null;for(const key of ['toggle','current','id','session','more','copy'])if(el.dataset[key])return {key,value:el.dataset[key],className:el.classList[0]};if(el.matches('details > summary'))return {summary:el.parentElement.className};return el.id?{id:el.id}:null}
function restoreFocus(container,ref){if(!ref)return;const el=ref.summary?[...container.querySelectorAll('details')].find(e=>e.className===ref.summary)?.querySelector('summary'):ref.id?document.getElementById(ref.id):[...container.querySelectorAll('[data-'+ref.key+']')].find(e=>e.dataset[ref.key]===ref.value&&e.classList[0]===ref.className);el?.focus({preventScroll:true})}
const attemptStep=x=>`<div class="attempt-step ${color(x.outcome)}"><span class="step-number">${x.number.toString().padStart(2,'0')}</span><div class="step-content"><b>${esc(x.credential_name)}</b><span>${esc(labels[x.outcome]||x.outcome)}${x.reason?' · '+esc(x.reason):''}</span></div></div>`;
let renderedDetail='';
let embeddedAuth=false;
let auth='',offset=0,total=0,session='',selected='',attemptOffset=0,rows=[],busy=false,detailBusy=false;
// Reuse CPAMP's existing same-origin persisted login. The host uses this
// versioned XOR storage format; no credentials are sent to another origin.
function restoreManagerLogin(){
 try{
  if(window.parent===window)return false;
  if(window.parent.location.origin!==location.origin)return false;
  if(!window.parent.location.hash.startsWith('#/plugin-pages/anyrouter-retry/'))return false;
  const raw=localStorage.getItem('cli-proxy-auth');if(!raw)return false;
  let text=raw;
  if(raw.startsWith('enc::v2::')||raw.startsWith('enc::v1::')){
   const tag='cli-proxy-api-webui::secure-storage';
   const key=new TextEncoder().encode(raw.startsWith('enc::v2::')?tag+'|v2|'+location.host:tag+'|'+location.host+'|'+navigator.userAgent);
   const data=Uint8Array.from(atob(raw.slice(9)),c=>c.charCodeAt(0));
   text=new TextDecoder().decode(data.map((v,i)=>v^key[i%key.length]));
  }
  const state=JSON.parse(text).state;
  if(!state?.managementKey||new URL(state.apiBase).origin!==location.origin)return false;
  auth=state.managementKey;embeddedAuth=true;return true;
 }catch{return false}
}
restoreManagerLogin();
async function api(path){const base='/v0/management/plugins/anyrouter-retry/';const r=await fetch(base+path,{headers:{Authorization:'Bearer '+auth},cache:'no-store'});if(!r.ok){if(r.status===401||r.status===403){auth='';throw Error('访问已过期或密钥无效，请重新连接。')}throw Error(`CPA 返回 HTTP ${r.status}`)}return r.json()}
function filter(){offset=0;session='';selected='';attemptOffset=0;load()}
async function load(){if(!auth||busy)return;busy=true;$('refresh').setAttribute('aria-busy','true');if(!rows.length)$('feed').innerHTML=skeleton();try{const q=new URLSearchParams({q:$('search').value,phase:$('phase').value,limit:200,offset,session});const data=await api('requests?'+q);rows=data.requests;total=data.total;const rt=data.runtime;$('runtime').textContent=`v${rt.version} · ${rt.accept_new_requests?'正在接管':'暂停新请求'}`;$('runtime').className='status '+(rt.accept_new_requests?'green':'');$('message').textContent=rt.trace_storage_errors_current_instance?'记录写入曾失败，明细可能不完整；请求仍按原重试逻辑处理。':'';if(!selected&&rows.length){selected=rows[0].id}renderFeed(data.server_time);$('footer').textContent=`更新于 ${clock(data.server_time)} · 保留 ${rt.trace_retention_days} 天 · 完成表示收到 response.completed 并提交到宿主下游流，不代表整个会话任务结束。`;$('scope').textContent=session?`会话 ${session} · 只展示插件接管的请求`:'统计当前页 · 按会话分组 · 仅展示插件接管并记录的请求。';if(!selected&&rows.length){selected=rows[0].id}if(selected)await loadDetail();else {renderedDetail='';$('detail').innerHTML=emptyState('没有匹配的请求','调整筛选条件，或清除筛选查看全部记录。');}$('loginError').textContent=''}catch(e){$('message').textContent=e.message}finally{busy=false;$('refresh').setAttribute('aria-busy','false')}}
function renderFeed(now){
 const scroll=$('feed').scrollTop,focus=rememberFocus($('feed')),groups=new Map();
 for(const r of rows){const key=r.session_id||('missing:'+r.id);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)}
 const sorted=[...groups];
 if($('activeFirst').checked)sorted.sort((a,b)=>Number(b[1].some(active))-Number(a[1].some(active)));
 let html='';
 for(const [id,rs] of sorted){
  const first=rs[0],running=rs.filter(active).length,done=rs.filter(r=>r.phase==='completed').length,retried=rs.filter(r=>r.phase==='completed'&&r.retries>0).length;
  const project=first.project||'会话 · '+short(first.session_id);
  const current=rs.find(r=>active(r)&&r.thread_id===r.session_id)||rs.find(active)||first;
  const currentReason=current.final_reason||current.last_failure?.reason;
  const currentLabel=agent(current)?'子代理 '+agent(current):'主线程';
  html+=`<article class="session-group ${rs.some(r=>r.id===selected)?'selected-session':''}"><div class="session-head"><div class="session-heading"><button class="collapse" data-toggle="${esc(id)}" aria-label="${openSessions.has(id)?'收起':'展开'} ${esc(project)}" aria-expanded="${openSessions.has(id)}">${icon('chevron')}</button><button class="session-link" data-toggle="${esc(id)}" title="${esc(heading(first))} · 点击展开 / 收起请求">${esc(project)}<span class="session-title">${esc(first.session_title||'未同步会话标题')}</span></button></div><button class="session-current" data-current="${esc(current.id)}" aria-label="查看 ${esc(project)} 的${active(current)?'当前':'最近'}请求"><div class="session-current-top"><span class="muted">${esc(currentLabel)}</span>${badge(current.phase)}</div><div class="current-provider">${esc(provider(current))}</div><div class="current-metrics"><span>${current.attempts} 次尝试 · ${current.retries} 次重试</span><span>${active(current)?'已用时':'耗时'} ${duration((current.ended_at||now)-current.started_at)}</span></div>${currentReason?`<div class="request-note">最近失败：${esc(currentReason)}</div>`:''}</button><div class="session-meta"><span>${running?running+' 条处理中 · ':''}${done} 条完成${retried?' · '+retried+' 条经重试完成':''}</span><span class="mono session-id" title="${esc(first.session_id)}">${esc(short(first.session_id))}</span>${first.session_id?`<button class="session-filter" data-session="${esc(first.session_id)}">只看此会话</button>`:''}</div></div>`;
  if(!openSessions.has(id)){html+='</article>';continue;}
  const requests=[...rs];if($('activeFirst').checked)requests.sort((a,b)=>Number(active(b))-Number(active(a)));
  const visible=expandedGroups.has(id)?requests:requests.slice(0,Math.max(5,running));
  for(const r of visible){
   const last=r.last_attempt,reason=r.final_reason||r.last_failure?.reason||r.last_failure?.error_code;
   html+=`<button class="request ${r.id===selected?'selected':''}" data-id="${esc(r.id)}"><div class="request-top"><span class="request-title">${esc(provider(r))}<small>${clock(r.started_at)}</small></span>${badge(r.phase)}</div><div class="request-bottom"><span>${r.attempts} 次尝试 · ${r.retries} 次重试</span><span>${active(r)?'已用时':'耗时'} ${duration((r.ended_at||now)-r.started_at)}</span></div>${agent(r)?`<div class="agent-tag">子代理 · ${esc(agent(r))}</div>`:''}${reason?`<div class="request-note" title="${esc(reason)}">${r.final_reason?'结束原因':'最近失败'}：${esc(reason)}</div>`:''}<div class="request-bottom"><span>${esc(r.model)}</span><span class="mono" title="请求 ${esc(r.id)}">请求 ${esc(short(r.id))}</span></div></button>`;
  }
  if(requests.length>visible.length)html+=`<button class="more-requests" data-more="${esc(id)}">展开其余 ${requests.length-visible.length} 条请求</button>`;
  html+='</article>';
 }
 $('feed').innerHTML=html||emptyState('没有匹配的请求','调整状态或搜索条件，查看已记录的请求。');$('feed').scrollTop=scroll;
 $('feed').querySelectorAll('[data-current]').forEach(b=>b.onclick=()=>{selected=b.dataset.current;attemptOffset=0;renderFeed(Date.now());loadDetail()});
 $('feed').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=b.dataset.id;attemptOffset=0;renderFeed(Date.now());loadDetail()});
 $('feed').querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{expandedGroups.add(b.dataset.more);renderFeed(Date.now())});
 $('feed').querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const id=b.dataset.toggle;openSessions.has(id)?openSessions.delete(id):openSessions.add(id);saveOpenSessions();renderFeed(Date.now())});
 $('feed').querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>{if(!b.dataset.session)return;session=b.dataset.session;$('search').value='';$('phase').value='all';offset=0;selected='';load()});
 restoreFocus($('feed'),focus);
 $('count').textContent=`${groups.size} 个 · ${total} 请求`;$('page').textContent=total?`${offset+1}–${Math.min(offset+200,total)}`:'0 条';$('prev').disabled=offset===0;$('next').disabled=offset+200>=total;
 const done=rows.filter(r=>r.phase==='completed');
 const metrics=[['本页会话',groups.size,'个',''],['处理中',rows.filter(active).length,'请求','live'],['已完成',done.length,'请求',''],['经重试完成',done.filter(r=>r.attempts>1).length,'请求',''],['失败 / 中断',rows.filter(r=>['failed','interrupted'].includes(r.phase)).length,'请求','issue'],['累计尝试',rows.reduce((n,r)=>n+r.attempts,0),'次','']];
 $('summary').innerHTML=metrics.map(([label,value,unit,tone])=>`<div class="metric ${tone}"><span class="metric-label">${label}</span><div class="metric-value"><b>${value}</b><small>${unit}</small></div></div>`).join('');
}
async function loadDetail(){
 if(!selected||detailBusy)return;
 detailBusy=true;
 const wanted=selected,details=$('detail');
 if(renderedDetail!==wanted){details.innerHTML=skeleton();details.scrollTop=0;}
 try{
  const d=await api('trace?'+new URLSearchParams({id:wanted,offset:attemptOffset,limit:200}));
  if(selected!==wanted)return;
  const r=d.request,now=d.server_time,a=r.last_attempt,attempts=d.attempts;
  const same=renderedDetail===wanted,scroll=same?details.scrollTop:0,focus=rememberFocus(details);
  const identityOpen=same&&details.querySelector('.identity')?.open,technicalOpen=same&&details.querySelector('.technical')?.open;
  let warning='';
  if(r.phase==='unknown_after_restart')warning+='宿主已重启，这条旧请求没有记录终态，最终结果未知。';
  if(r.details_truncated)warning+='逐次明细达到大小上限；累计次数继续记录，后续顺序未保存。';
  if(r.storage_errors)warning+=`记录写入失败 ${r.storage_errors} 次，明细可能不完整。`;
  const sequence=[...attempts,...(a&&!a.ended_at?[a]:[])];
  const resultTitle=a?`${r.phase==='completed'?'完成于':'最近 / 当前'} ${a.credential_name} · 第 ${a.number} 次尝试`:'正在选择供应商凭据';
  const resultNote=r.final_reason?`结束原因：${r.final_reason}${r.final_code?' · '+r.final_code:''}`:r.last_failure?`最近失败：第 ${r.last_failure.number} 次 · ${r.last_failure.credential_name} · ${r.last_failure.reason||r.last_failure.error_code||r.last_failure.outcome}`:r.phase==='completed'?'已收到 response.completed，输出已提交到宿主下游流。':a&&!a.ended_at?`本次尝试已用时 ${duration(now-a.started_at)}，当前${labels[r.phase]||r.phase}。`:'尚无失败记录。';
  details.innerHTML=`
   <div class="detail-top"><div><div class="eyebrow">请求详情</div><h2>${esc(heading(r))}</h2><div class="detail-subtitle">${r.project?`<span>${esc(r.project)}</span>`:''}${agent(r)?`<span>子代理 ${esc(agent(r))}</span>`:''}<span>${esc(r.model)}</span><span>${clock(r.started_at)}</span></div><span class="request-ref mono">请求 ${esc(short(r.id))} · 插件 v${esc(r.version)}</span></div>${badge(r.phase)}</div>
   <div class="result-strip ${color(r.phase)}"><span class="result-icon">${icon(r.phase==='completed'?'check':color(r.phase)==='red'?'error':r.phase==='streaming'?'stream':'wait')}</span><div><strong>${esc(resultTitle)}</strong><p>${esc(resultNote)}</p></div></div>
   <div class="facts"><div class="fact"><span>总尝试</span><b>${r.attempts}<small>次</small></b></div><div class="fact"><span>重试</span><b>${r.retries}<small>次</small></b></div><div class="fact"><span>${active(r)?'已用时':'累计耗时'}</span><b>${duration((r.ended_at||now)-r.started_at)}</b></div><div class="fact"><span>首次输出</span><b>${r.first_output_at?duration(r.first_output_at-r.started_at):'尚未输出'}</b></div></div>
   ${warning?`<div class="notice">${esc(warning)}</div>`:''}
   <h3>供应商尝试顺序${d.total>200?' · 当前明细页':''}</h3>
   <div class="sequence" aria-label="供应商尝试顺序">${sequence.length?sequence.map(attemptStep).join('<span class="step-arrow" aria-hidden="true">→</span>'):'<span class="muted">尚未开始尝试</span>'}</div>
   <h3>逐次结果</h3>
   <div class="table-wrap"><table aria-label="逐次尝试结果"><thead><tr><th>次数 / 开始</th><th>AnyRouter</th><th>耗时</th><th title="CPA 宿主返回的状态，可能由流内错误映射">CPA 状态</th><th>结果</th><th>原因 / 上游 Trace</th></tr></thead><tbody>${sequence.map(x=>`<tr><td><span class="attempt-number">#${x.number}</span><br><span class="muted">${clock(x.started_at)}</span></td><td>${esc(x.credential_name)}</td><td>${duration((x.ended_at||now)-x.started_at)}</td><td>${x.http_status||'—'}</td><td>${badge(x.outcome)}</td><td class="reason">${esc(x.reason||'—')}<span class="trace-code mono">${esc(x.error_code||'')}${x.upstream_trace?'<br>Trace: '+esc(x.upstream_trace):''}</span></td></tr>`).join('')}</tbody></table></div>
   <div class="pager"><span>${d.total} 条已保存尝试 · ${d.total?attemptOffset+1:0}–${Math.min(attemptOffset+200,d.total)}</span><div><button id="attemptPrev" ${attemptOffset===0?'disabled':''}>上一页</button><button id="attemptNext" ${attemptOffset+200>=d.total?'disabled':''}>下一页</button></div></div>
   <h3>供应商调用汇总</h3><div class="table-wrap"><table aria-label="供应商调用汇总"><thead><tr><th>凭据</th><th>尝试</th><th>完成</th><th>失败</th></tr></thead><tbody>${Object.values(r.credentials).map(g=>`<tr><td>${esc(g.name)}</td><td>${g.attempts}</td><td>${g.completed}</td><td>${g.failed}</td></tr>`).join('')}</tbody></table></div>
   ${a&&a.host_open_ms!==undefined?`<details class="technical"><summary>等待与转发计时 · 查看 CPA 与插件耗时</summary><div class="timing"><div>CPA 打开模型流：<b>${!a.host_opened_at&&active(r)?'进行中，最终耗时尚未返回':duration(a.host_open_ms)}</b></div><div>首个 CPA 数据帧 → 首次转发：<b>${a.first_forwarded_at&&a.first_host_frame_at?duration(a.first_forwarded_at-a.first_host_frame_at):'尚未转发'}</b></div><div>事件 JSON 检测累计：${(a.parse_micros/1000).toFixed(2)} ms · 下游 emit 累计：${(a.emit_micros/1000).toFixed(2)} ms</div><p class="muted">CPA 打开流的耗时包含上游等待及 CPA 原生启动缓冲；首帧到转发的间隔也可能包含等待后续内容，不是插件纯 CPU 耗时。emit 包含下游消费等待。</p></div></details>`:''}
   <details class="identity"><summary>会话与请求标识 · 展开查看 / 复制</summary><div class="id-block"><span class="muted">请求 ID</span><span class="mono">${esc(r.id)} <button class="copy-id" data-copy="${esc(r.id)}">复制</button></span><span class="muted">Session</span><span class="mono">${esc(r.session_id||'未提供；此请求独立展示')} ${r.session_id?`<button class="copy-id" data-copy="${esc(r.session_id)}">复制</button>`:''}</span><span class="muted">Thread</span><span class="mono">${esc(r.thread_id||'未提供')}</span><span class="muted">父线程</span><span class="mono">${esc(r.parent_thread_id||'—')}</span><span class="muted">Turn</span><span class="mono">${esc(r.turn_id||'未提供')}</span><span class="muted">身份来源</span><span>${esc(r.identity_source)}</span><span class="muted">开始时间</span><span>${date(r.started_at)} · ${esc(r.model)}</span></div></details>
   <p class="footer">CPA 返回 200 不等于完成；CPA 可能将上游 HTTP 200 内的限流错误映射为 503。这里展示 CPA 状态，凭据名称为调用时名称。记录更新于 ${clock(r.updated_at)}。</p>`;
  renderedDetail=wanted;
  if(identityOpen)details.querySelector('.identity').open=true;
  if(technicalOpen&&details.querySelector('.technical'))details.querySelector('.technical').open=true;
  details.scrollTop=scroll;restoreFocus(details,focus);
  details.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='已复制'}catch{b.textContent='复制失败'}});
  $('attemptPrev').onclick=()=>{attemptOffset=Math.max(0,attemptOffset-200);loadDetail()};
  $('attemptNext').onclick=()=>{attemptOffset+=200;loadDetail()};
 }catch(e){$('message').textContent=e.message;if(renderedDetail!==wanted)details.innerHTML=emptyState('暂时无法读取请求',e.message)}
